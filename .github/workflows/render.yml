name: Render Remotion Video

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan ini manual dari tab Actions

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        # Menggunakan ID komposisi yang benar. 
        # Pastikan ID di Root.tsx Anda adalah "DataExplainer" (atau sesuaikan jika berbeda)
        run: npx remotion render src/index.ts DataExplainer out/video.mp4 --codec=h264 --crf=20

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
